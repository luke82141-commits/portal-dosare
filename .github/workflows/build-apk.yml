# Compilează APK-ul Android pe serverele GitHub, ca să nu depindem de un
# anumit laptop. Pornește manual (Actions → Build APK → Run workflow) sau
# la fiecare tag „v*”. APK-ul apare la Releases, gata de descărcat pe telefon.
name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Publică APK-ul (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Portal Dosare – build ${{ github.run_number }}
          prerelease: true
          body: |
            APK de test, compilat pe GitHub din commit ${{ github.sha }}.
            Pe telefon: descarcă **app-arm64-v8a-release.apk** și instalează-l.
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
